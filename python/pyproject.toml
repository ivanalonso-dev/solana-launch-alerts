[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "solana-launch-alerts"
version = "1.0.0"
description = "Verify and parse signed launch-risk alert webhooks for Solana launchpads (open standard, spec 2026-10)."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
authors = [{name = "Ivan Alonso (EMERGE)"}]
keywords = ["solana", "webhook", "hmac", "security", "launchpad", "alerts"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Security",
]

[project.optional-dependencies]
test = ["pytest>=7", "jsonschema>=4"]

[tool.setuptools]
packages = ["solana_launch_alerts"]
